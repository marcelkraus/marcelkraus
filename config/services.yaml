# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.contact_email_address: 'mail@marcelkraus.de'
    # Shown on the legal pages only, so what is harvested there arrives on its own tag.
    app.legal_email_address: 'mail+legal@marcelkraus.de'
    app.whats_app_url: 'https://wa.me/message/TKVKBR7RPHA7B1'

    # The tabs and the sitemap read this list.
    app.pages:
        - { label: 'Profil', route: 'app_homepage' }
        - { label: 'Portfolio', route: 'app_portfolio' }
        - { label: 'Kontakt', route: 'app_contact_page' }

    app.phone_number: '0163 6938184'

    # The profile of the printed curriculum vitae, one entry per paragraph.
    app.curriculum_vitae_profile:
        - >-
            Ich bin Senior Softwareentwickler mit über zwanzig Jahren
            Berufserfahrung. Seit zehn Jahren bin ich bei der Chefkoch GmbH in
            Bonn tätig, seit 2020 remote; Ende November 2026 verlasse ich das
            Unternehmen.
        - >-
            Dort gestartet als PHP-Entwickler, habe ich später als
            Mitverantwortlicher für die iOS- und iPadOS-App an einer Plattform
            mitgearbeitet, die insgesamt rund 20 Millionen Nutzer im Monat
            erreicht.
        - >-
            Meine Schwerpunkte sind die eigenständige Gestaltung und Umsetzung
            von Produktideen sowie die technische Modernisierung gewachsener
            Systeme – zum Beispiel Objective-C auf Swift, UIKit auf SwiftUI
            oder Drupal 8 auf ein neues Content-Management-System.
        - >-
            Neben meinen Festanstellungen bin ich seit 2002 selbstständig, in
            den Bereichen Internet-, IT- & 3D-Druck-Dienstleistungen sowie der
            Vermietung eines Filmfahrzeugs.

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
