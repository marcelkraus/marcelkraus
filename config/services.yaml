# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Outbound targets. They live here rather than inside the redirect
    # routes, so a changed address is one edit in one place – both sibling
    # projects keep the same list.
    app.contact_email_address: 'mail@marcelkraus.de'
    # Only the imprint and the privacy policy show an address, and they show
    # this one: whatever is harvested from a legal page arrives on its own
    # tag and can be filtered without touching the mailbox.
    app.legal_email_address: 'mail+legal@marcelkraus.de'
    app.whats_app_url: 'https://wa.me/message/TKVKBR7RPHA7B1'

    # Last day of the current employment. The availability stated on the
    # page is derived from it rather than written out, so the sentence
    # cannot fall out of date between two edits.
    app.employment_end_date: '2026-11-30'

    # Printed on the curriculum vitae and nowhere else. The page keeps the
    # number out of its markup, as it does the mail address.
    app.phone_number: '0163 6938184'

    # The short profile of the printed curriculum vitae, one entry per
    # paragraph. It exists nowhere on the page – the hero carries a tagline,
    # which is a different thing – so it lives here rather than in a content
    # file the page would then have to ignore.
    app.curriculum_vitae_profile:
        - >-
            Ich bin Senior Software-Entwickler mit über zwanzig Jahren
            Berufserfahrung. Die letzten zehn Jahre war ich bei der Chefkoch
            GmbH in Bonn tätig, seit 2020 remote.
        - >-
            Dort gestartet als PHP-Entwickler, habe ich später als
            Mitverantwortlicher für die iOS- und iPadOS-App an einer Plattform
            mitgearbeitet, die insgesamt rund 20 Millionen Nutzer im Monat
            erreicht.
        - >-
            Meine Schwerpunkte sind die eigenständige Gestaltung und Umsetzung
            von Produktideen sowie die technische Modernisierung gewachsener
            Systeme – zum Beispiel Objective-C auf Swift, UIKit auf SwiftUI
            oder Drupal 8 auf ein neues Content-Management-System.
        - >-
            Neben meinen Festanstellungen bin ich seit 2002 selbstständig, in
            den Bereichen der Internet-, IT- & 3D-Druck-Dienstleistungen sowie
            der Vermietung eines Filmfahrzeugs.

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
